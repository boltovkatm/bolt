<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Набор в команду — BOLTOVKA ANARCHY</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html"><span class="brand-mark">B</span><span>BOLTOVKA<br><em>ANARCHY</em></span></a></header><main class="form-page"><a class="text-link" href="index.html#apply">← На главную</a><p class="eyebrow" style="margin-top:45px">СТАНЬ ЧАСТЬЮ ПРОЕКТА</p><h1>НАБОР В<br><i>КОМАНДУ</i></h1><p class="form-lead">Выберите направление, заполните общую анкету и вопросы для выбранной роли. Заявка сохраняется и будет рассмотрена командой.</p><form id="application-form"><fieldset><legend>Кем вы хотите быть?</legend><div class="role-grid"><label><input type="radio" name="role" value="tech" required><span>🛠<b>Тех. админ</b></span></label><label><input type="radio" name="role" value="admin"><span>👮<b>Администратор</b></span></label><label><input type="radio" name="role" value="support"><span>💬<b>Поддержка</b></span></label><label><input type="radio" name="role" value="builder"><span>🏗<b>Билдер</b></span></label><label><input type="radio" name="role" value="tester"><span>🧪<b>Тестер</b></span></label></div></fieldset><fieldset><legend>Общая анкета</legend><div class="field-grid"><label>Игровой ник<input name="nickname" required maxlength="16" pattern="[A-Za-z0-9_]{3,16}"></label><label>Настоящее имя<input name="realName" required maxlength="80"></label><label>Возраст<input name="age" type="number" min="10" max="100" required></label><label>Discord (с тегом)<input name="discord" required maxlength="80"></label><label>Telegram<input name="telegram" required maxlength="80"></label><label>Часовой пояс<input name="timezone" required placeholder="Например: UTC+5"></label><label>Часов в день на сервер<input name="dailyHours" required></label><label>Есть ли микрофон?<select name="microphone" required><option value="">Выберите</option><option>Да</option><option>Нет</option></select></label></div><label>Почему хотите попасть именно в команду BOLTOVKA ANARCHY?<textarea name="motivation" required></textarea></label><label>Были ли вы ранее в администрации других проектов? Если да — укажите название, должность и срок.<textarea name="previousExperience" required></textarea></label><label>Есть ли опыт работы в выбранной должности?<textarea name="roleExperience" required></textarea></label><label>Почему именно вас мы должны выбрать?<textarea name="whyYou" required></textarea></label></fieldset><fieldset id="role-questions" hidden><legend id="role-title"></legend><div id="role-fields"></div></fieldset><button class="button primary" type="submit">Отправить заявку <b>→</b></button><p id="form-status" class="form-status" role="status"></p></form></main><script src="apply.js"></script></body></html>
